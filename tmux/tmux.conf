

#My tmux configuration

#set my master key(Crtl+x)
unbind C-b
set -g prefix C-x
bind C-x send-prefix
set -g base-index 1
setw -g pane-base-index 1

unbind C-r
unbind -n C-r

bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"


#this is the keybindings for selecting panes

setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

#alt

bind -n M-x kill-window
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-n send-keys "make check" Enter
bind -n M-m send-keys "make gpp" Enter
bind -n M-d send-keys "make gdb" Enter

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-1 select-window -t 1

unbind r 
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

#In order for tmux to support 256-color in my terminal

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on 
set -g set-clipboard on

# Pick a softer palette.
#set -g @catppuccin_flavor 'frappe'
#set -g @catppuccin_window_status_style "rounded"

#run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Make the status line more pleasant.
set -g window-status-style "bg=default,fg=#363a4f"
set -g window-status-current-style "bg=default,fg=#fff3b0,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-separator "|"
set -g status-left ""
set -g status-right '#[fg=#{@thm_crust},bg=#{@thm_teal}] session: #S'

# Ensure that everything on the right side of the status line
# is included.
set -g status-right-length 100
set -g status-style "bg=default,fg=#fff3b0"
